name: external-claim-adapter

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 13 * * 1'

permissions:
  contents: read

jobs:
  offline-integrity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adapter regression tests
        run: python tools/test_external_claim_adapter.py
      - name: Validate canonical registries offline
        run: python tools/validate_external_claim_adapter.py --root .
      - name: Test public bibliography identity crosswalk
        run: python tools/test_research_identity_crosswalk.py
      - name: Test dated public research intake
        run: python tools/test_research_intake_2026_10_08.py
      - name: Test next-pass public paper intake
        run: python tools/test_research_intake_next_pass_2026_10_08.py
      - name: Test claim-level prior-art intake coverage
        run: python tools/test_prior_art_closure_2026_10_09.py
      - name: Validate generated public bibliography identity crosswalk
        run: python tools/reconcile_public_bibliography.py --check

  source-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reviewed public sources
        run: |
          registry_sha=$(python tools/validate_external_claim_adapter.py --registry-sha256)
          python tools/validate_external_claim_adapter.py --source-report --check-live \
            --expected-registry-sha256 "$registry_sha" > source-readback.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("source-readback.json", encoding="utf-8"))
          print("## Reviewed source health")
          for row in report["works"]:
              if row.get("live_check") or row["state"] != "review-required":
                  print(f"- {row['work_id']} · {row['state']}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-source-readback-${{ github.sha }}
          path: source-readback.json
          if-no-files-found: error
          retention-days: 14
