name: external-claim-adapter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adapter regression tests
        run: python tools/test_external_claim_adapter.py
      - name: Validate generated knowledge Wiki projection
        run: python tools/test_wiki_navigation.py
      - name: Validate canonical registries offline
        run: python tools/validate_external_claim_adapter.py --root .
      - name: Test public bibliography identity crosswalk
        run: python tools/test_research_identity_crosswalk.py
      - name: Test dated public research intake
        run: python tools/test_research_intake_2026_10_08.py
      - name: Test next-pass public paper intake
        run: python tools/test_research_intake_next_pass_2026_10_08.py
      - name: Test claim-level prior-art intake coverage
        run: python tools/test_prior_art_closure_2026_10_09.py
      - name: Validate generated public bibliography identity crosswalk
        run: python tools/reconcile_public_bibliography.py --check
