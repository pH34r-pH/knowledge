name: external-claim-adapter

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 13 * * 1'

permissions:
  contents: read

jobs:
  offline-integrity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run adapter regression tests
        run: python tools/test_external_claim_adapter.py
      - name: Validate canonical registries offline
        run: python tools/validate_external_claim_adapter.py --root .
      - name: Test public bibliography identity crosswalk
        run: python tools/test_research_identity_crosswalk.py
      - name: Test dated public research intake
        run: python tools/test_research_intake_2026_10_08.py
      - name: Test next-pass public paper intake
        run: python tools/test_research_intake_next_pass_2026_10_08.py
      - name: Test claim-level prior-art intake coverage
        run: python tools/test_prior_art_closure_2026_10_09.py
      - name: Validate generated public bibliography identity crosswalk
        run: python tools/reconcile_public_bibliography.py --check

  source-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    outputs:
      freshness: ${{ steps.readback.outputs.freshness }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check reviewed public sources
        id: readback
        run: |
          registry_sha=$(python tools/validate_external_claim_adapter.py --registry-sha256)
          python tools/validate_external_claim_adapter.py --source-report --check-live \
            --expected-registry-sha256 "$registry_sha" > source-readback.json
          python - "$GITHUB_OUTPUT" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          report = json.load(open("source-readback.json", encoding="utf-8"))
          freshness = report["reviewed_freshness"]
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write(f"freshness={freshness['state']}\n")
          print("## Reviewed source health")
          for row in report["works"]:
              if row.get("live_check") or row["state"] != "review-required":
                  print(f"- {row['work_id']} · {row['state']}")
          coverage = report["citation_coverage"]
          print(f"\n## Corpus citation coverage ({coverage['identifier_count']} distinct identifiers)")
          for state, count in coverage["by_state"].items():
              print(f"- {state} · {count}")
          print("\nThe report lists the citing articles and matching Work IDs.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-source-readback-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source-readback.json
          if-no-files-found: error
          retention-days: 14

  reviewed-source-freshness:
    needs: source-readback
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require current evidence for reviewed metadata use
        env:
          FRESHNESS: ${{ needs.source-readback.outputs.freshness }}
        run: |
          if [ "$FRESHNESS" != current ]; then
            echo "::error::A declared metadata use needs source review. See the source-readback report."
            exit 1
          fi
